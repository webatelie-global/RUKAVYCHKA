<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffdf7">
  <meta name="description" content="RUKAVYCHKA animal shelter in Ukraine. Every life deserves a loving home.">
  <title>RUKAVYCHKA — Animal Shelter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #fffdf7;
      --white: #ffffff;
      --blue: #dcecf3;
      --blue-dark: #a9cbdc;
      --yellow: #f5e8b5;
      --text: #273b46;
      --muted: #71818a;
      --line: #e9e8df;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
      object-fit: cover;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-family: "Manrope", sans-serif;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .logo span {
      color: #83aebe;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #719eaf;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .language {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
      color: var(--text);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s ease;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .button-primary {
      background: var(--text);
      color: white;
    }

    .button-primary:hover {
      background: #405b68;
    }

    .button-light {
      background: var(--white);
      border-color: var(--line);
      color: var(--text);
    }

    .button-light:hover {
      background: var(--blue);
    }

    .hero {
      padding: 72px 0 80px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 55px;
    }

    .eyebrow {
      display: inline-block;
      color: #648b9b;
      background: var(--blue);
      border-radius: 30px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1, h2, h3 {
      font-family: "Manrope", sans-serif;
      line-height: 1.15;
    }

    h1 {
      font-size: clamp(42px, 5vw, 66px);
      letter-spacing: -2px;
      margin-bottom: 22p;

    h1 span {
      color: #83aebe;
    }

    .hero-text {
      max-width: 490px;
      color: var(--muted);
      font-size: 17px;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

.hero-image {
      height: 480px;
      border-radius: 22px;
      overflow: hidden;
      background: var(--blue);
    }

    .hero-image img {
      height: 100%;
    }

    .section {
      padding: 82px 0;
    }

    .section-heading {
      max-width: 650px;
      margin-bottom: 38px;
    }

    .section-heading h2 {
      font-size: clamp(30px, 4vw, 43px);
      letter-spacing: -1px;
      margin-bottom: 15px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 16px;
    }

    .about {
      background: var(--blue);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 55px;
      align-items: center;
    }

    .about-image {
      height: 390px;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .about-image img {
      height: 100%;
    }

    .about-copy h2 {
      font-size: clamp(30px, 4vw, 42px);
      margin-bottom: 20px;
    }

    .about-copy p {
      color: #526873;
      margin-bottom: 15px;
    }

    .mission-strip {
      background: var(--yellow);
      padding: 30px 0;
    }

    .mission-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .mission-inner h2 {
      font-size: 24px;
    }

    .mission-inner p {
      color: #68757a;
      max-width: 500px;
    }
  </style>
</head>
